<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Monitor - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated Background */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        
        .bg-animation .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 15s infinite;
        }
        
        .bg-animation .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }
        
        .bg-animation .circle:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -200px;
            right: -200px;
            animation-delay: 3s;
        }
        
        .bg-animation .circle:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 6s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            width: 440px;
            max-width: 90%;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
        }
        
        .logo-icon span {
            font-size: 34px;
        }
        
        h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 32px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 24px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 18px;
        }
        
        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            background: white;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .toggle {
            text-align: center;
            margin-top: 24px;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .toggle:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .forgot-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }
        
        .forgot-link a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
        }
        
        .forgot-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            border-left: 4px solid #c53030;
        }
        
        .success {
            background: #c6f6d5;
            color: #276749;
            border-left: 4px solid #276749;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }
        
        .feature {
            text-align: center;
        }
        
        .feature i {
            font-size: 20px;
            color: #667eea;
            margin-bottom: 6px;
            display: inline-block;
        }
        
        .feature span {
            font-size: 11px;
            color: #a0aec0;
            display: block;
            margin-top: 4px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }
            .features {
                gap: 12px;
            }
            .feature i {
                font-size: 16px;
            }
            .feature span {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <span>⚡</span>
            </div>
            <h2>Power Monitor</h2>
            <div class="subtitle">Track your energy consumption</div>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i>📧</i>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i>🔒</i>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
            </div>
            
            <!-- Forgot Password Link - Added here -->
            <div class="forgot-link">
                <a href="forgot-password.html">🔐 Forgot Password?</a>
            </div>
            
            <button onclick="doLogin()">→ Login</button>
            <div class="toggle" onclick="showRegisterForm()">📝 Create New Account</div>
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display: none;">
            <div class="input-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i>👤</i>
                    <input type="text" id="regName" placeholder="John Doe">
                </div>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i>📧</i>
                    <input type="email" id="regEmail" placeholder="your@email.com">
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i>🔒</i>
                    <input type="password" id="regPassword" placeholder="Minimum 6 characters">
                </div>
            </div>
            <button onclick="doRegister()">📝 Register</button>
            <div class="toggle" onclick="showLoginForm()">← Back to Login</div>
        </div>

        <div id="messageDiv"></div>

        <div class="features">
            <div class="feature">
                <i>📊</i>
                <span>Real-time Analytics</span>
            </div>
            <div class="feature">
                <i>🔌</i>
                <span>Device Tracking</span>
            </div>
            <div class="feature">
                <i>📥</i>
                <span>Export Reports</span>
            </div>
            <div class="feature">
                <i>🌙</i>
                <span>Dark Mode</span>
            </div>
            <div class="feature">
                <i>🤖</i>
                <span>AI Predictions</span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('messageDiv').innerHTML = '';
        }

        function showLoginForm() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('messageDiv').innerHTML = '';
        }

        function showMessage(msg, type) {
            var msgDiv = document.getElementById('messageDiv');
            msgDiv.innerHTML = '<div class="message ' + type + '">' + msg + '</div>';
            setTimeout(function() {
                msgDiv.innerHTML = '';
            }, 3000);
        }

        async function doLogin() {
            var email = document.getElementById('loginEmail').value;
            var password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('Please fill all fields', 'error');
                return;
            }
            
            try {
                var response = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                var data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('userName', data.user.name);
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showMessage(data.message || 'Login failed', 'error');
                }
            } catch(error) {
                showMessage('Cannot connect to server. Make sure backend is running on port 5000', 'error');
            }
        }

        async function doRegister() {
            var name = document.getElementById('regName').value;
            var email = document.getElementById('regEmail').value;
            var password = document.getElementById('regPassword').value;
            
            if (!name || !email || !password) {
                showMessage('Please fill all fields', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            try {
                var response = await fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: password })
                });
                var data = await response.json();
                
                if (data.success) {
                    showMessage('✅ Registration successful! Please login with your credentials.', 'success');
                    document.getElementById('regName').value = '';
                    document.getElementById('regEmail').value = '';
                    document.getElementById('regPassword').value = '';
                    showLoginForm();
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').value = '';
                } else {
                    showMessage(data.message || 'Registration failed', 'error');
                }
            } catch(error) {
                showMessage('Cannot connect to server. Make sure backend is running on port 5000', 'error');
            }
        }
    </script>
</body>
</html>
